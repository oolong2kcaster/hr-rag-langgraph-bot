services:
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: hr-rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-rag-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./:/app
    depends_on:
      - qdrant
    command: ["bash", "-lc", "tail -f /dev/null"]

volumes:
  qdrant_storage:
